services:
  server:
    restart: unless-stopped
    build: ./server
    image: tarantino-server
    ports:
      - "${PORT:-8000}:8000"
    environment:
      LOCK_LEAD_S: ${LOCK_LEAD_S:-5}
      BLOCKLIST: ${BLOCKLIST:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      LAN_URL: ${LAN_URL:-}
      TUNNEL_API: http://tunnel:2000/quicktunnel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      retries: 15

  engine:
    restart: unless-stopped
    profiles: ["demo"]
    image: tarantino-server
    pull_policy: never
    command: uv run --no-sync python scripts/fake_engine.py
    environment:
      ENGINE_URL: ws://server:8000/ws/engine
      BEAT_DURATION_S: ${BEAT_DURATION_S:-20}
    depends_on:
      server:
        condition: service_healthy

  tunnel:
    restart: unless-stopped
    profiles: ["share"]
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://server:8000
    depends_on:
      server:
        condition: service_healthy
