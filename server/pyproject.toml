[project]
name = "tarantino-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
 "httpx>=0.27",
 "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 5
